<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#173e34"><meta name="referrer" content="no-referrer">
<title>Public Finance · Course Atlas</title>
<style>
:root{color-scheme:light;font-family:"Avenir Next",Arial,sans-serif;color:#173d31;background:#f7f7ef}
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;align-content:center;justify-items:center;padding:26px}
main{width:min(100%,464px);padding:clamp(24px,6vw,42px);border:1px solid #cbd5c5;border-top:5px solid #204b39;border-radius:7px;background:#fffef7}
.kicker{font-size:12px;font-weight:700;letter-spacing:.11em;text-transform:uppercase;color:#506948}
h1{font:normal clamp(36px,7vw,57px)/1.05 Georgia,serif;letter-spacing:-.05em;margin:16px 0}
p{font-size:16px;line-height:1.5;color:#495e51;margin:0 0 26px}
label{display:block;margin-bottom:6px;font-weight:650}input,button{font:inherit;border-radius:5px;padding:11px 13px;width:100%}
input{border:1px solid #a2b39e;color:inherit;background:white}button{margin-top:12px;color:white;background:#204b39;border:1px solid #204b39;cursor:pointer;font-weight:650}button:disabled{opacity:.7;cursor:progress}
:focus-visible{outline:3px solid #c58424;outline-offset:3px}#feedback{font-size:14px;margin:12px 0 0;min-height:21px}
</style></head><body>
<main><div class="kicker">Course atlas</div><h1>Public Finance</h1>
<p>Enter your course passcode to open the map, questions and lecture slides.</p>
<form id="gate" autocomplete="off"><label for="passcode">Course passcode</label>
<input id="passcode" type="password" autocomplete="off" autocapitalize="none" spellcheck="false" required>
<button type="submit">Open course atlas</button><p id="feedback" role="status" aria-live="polite"></p></form>
<noscript>Enable JavaScript to unlock the atlas.</noscript></main>
<script>
(() => {
  'use strict';
  const release = '835008563cd54cdd';
  const salt = Uint8Array.from(atob('wJ7FI9yXZR99xambOFWgwA=='), c => c.charCodeAt(0));
  const encoder = new TextEncoder();
  const gate = document.getElementById('gate');
  const input = document.getElementById('passcode');
  const button = gate.querySelector('button');
  const status = document.getElementById('feedback');
  const asset = name => new URL(name + '-' + release + '.bin', location.href).href;
  let mapPacket;

  // Each unlocked map gets a private in-memory link. Ordinary anchors can open it
// in another tab, including via the context menu, without sharing the passcode.
function createSlideLink(loadSlides) {
  const name = 'course-slides-' + crypto.randomUUID();
  const channel = new BroadcastChannel(name);
  let pdfLink;
  channel.onmessage = async ({data}) => {
    if (data?.type !== 'request' || typeof data.id !== 'string') return;
    channel.postMessage({id: data.id, type: 'loading'});
    try {
      if (!pdfLink) {
        // The map owns the PDF URL so the native viewer can reload or download it.
        // Concurrent slide tabs share a download. A failed download can be retried.
        pdfLink = Promise.resolve().then(loadSlides).then(blob => URL.createObjectURL(blob))
          .catch(error => { pdfLink = undefined; throw error; });
      }
      channel.postMessage({id: data.id, type: 'ready', url: await pdfLink});
    } catch {
      channel.postMessage({id: data.id, type: 'error'});
    }
  };

  // The function is included in the transient link document below. It runs
  // independently of window.opener (all slide links use rel="noopener").
  function openSlideTab(session) {
    const channel = new BroadcastChannel(session);
    const message = document.getElementById('message');
    const retry = document.getElementById('retry');
    const id = crypto.randomUUID();
    let timer;
    function showRetry(text) {
      message.textContent = text;
      retry.hidden = false;
    }
    function request() {
      clearTimeout(timer);
      retry.hidden = true;
      message.textContent = 'Opening lecture slides…';
      timer = setTimeout(() => showRetry('Reopen the course map, enter the passcode, and select the slide link again.'), 12000);
      channel.postMessage({id, type: 'request'});
    }
    channel.onmessage = ({data}) => {
      if (data?.id !== id) return;
      clearTimeout(timer);
      if (data.type === 'loading') {
        message.textContent = 'Loading lecture slides…';
        timer = setTimeout(() => showRetry('The slides are taking a while to load. Keep the course map open and try again.'), 60000);
      } else if (data.type === 'error') {
        showRetry('The slides could not be loaded. Check your connection and try again.');
      } else if (data.type === 'ready') {
        const page = /^#page=[1-9]\d*$/.test(location.hash) ? location.hash : '';
        channel.close();
        location.replace(data.url + page);
      }
    };
    retry.onclick = request;
    request();
  }

  const html = `<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lecture slides · Public Finance</title>
<style>body{margin:10vh auto;padding:0 24px;max-width:34rem;color:#173d31;background:#f7f7ef;font:18px/1.5 system-ui}button{font:inherit;padding:4px 12px}</style></head>
<body><main><h1>Lecture slides</h1><p id="message" role="status">Opening lecture slides…</p>
<button id="retry" hidden>Try again</button></main>
<script>(${openSlideTab.toString()})(${JSON.stringify(name)})<\/script></body></html>`;
  return URL.createObjectURL(new Blob([html], {type: 'text/html;charset=utf-8'}));
}


  async function download(name) {
    const response = await fetch(asset(name));
    if (!response.ok) throw new Error('Course file unavailable');
    return new Uint8Array(await response.arrayBuffer());
  }

  async function unlockKey(password) {
    const material = await crypto.subtle.importKey('raw', password, 'PBKDF2', false, ['deriveKey']);
    return crypto.subtle.deriveKey({name:'PBKDF2', hash:'SHA-256', salt, iterations:600000},
      material, {name:'AES-GCM', length:256}, false, ['decrypt']);
  }

  function decrypt(key, label, packet) {
    return crypto.subtle.decrypt({name:'AES-GCM', iv:packet.subarray(0,12),
      additionalData:encoder.encode(release + '/' + label)}, key, packet.subarray(12));
  }

  function loadQuestionFigures(key) {
    const offsets = window.PF_FIGURES;
    const ready = new Map();
    const pendingImages = new WeakSet();
    let fullFile;
    async function fetchFigure(id) {
      const [start, length] = offsets[id];
      const end = start + length - 1;
      let packet;
      if (!fullFile) {
        const response = await fetch(asset('figures'), {headers:{Range:'bytes=' + start + '-' + end}});
        if (response.status === 206) {
          const range = response.headers.get('Content-Range') || '';
          if (!range.startsWith('bytes ' + start + '-' + end + '/')) throw new Error('Incomplete figure');
          packet = new Uint8Array(await response.arrayBuffer());
        } else if (response.status === 200) {
          // Some proxies return the entire file even when the browser asks for a range.
          fullFile = new Uint8Array(await response.arrayBuffer());
        } else throw new Error('Figure unavailable');
      }
      if (!packet) packet = fullFile.subarray(start, end + 1);
      if (packet.length !== length) { fullFile = undefined; throw new Error('Incomplete figure'); }
      const png = await decrypt(key, 'figure/' + id, packet);
      return URL.createObjectURL(new Blob([png], {type:'image/png'}));
    }
    async function show(img) {
      if (img.hasAttribute('src') || pendingImages.has(img)) return;
      pendingImages.add(img);
      const id = Number(img.dataset.pfFigure);
      if (!ready.has(id)) {
        ready.set(id, fetchFigure(id).catch(error => { ready.delete(id); throw error; }));
      }
      try {
        img.src = await ready.get(id);
      } catch {
        if (img.isConnected) {
          const retry = document.createElement('button');
          retry.textContent = 'Reload figure';
          retry.type = 'button';
          retry.onclick = () => { retry.remove(); show(img); };
          img.after(retry);
        }
      } finally { pendingImages.delete(img); }
    }
    const selector = 'img[data-pf-figure]';
    const scan = node => {
      if (node.nodeType !== 1) return;
      if (node.matches(selector)) show(node);
      else node.querySelectorAll(selector).forEach(show);
    };
    // Question cards are mounted when selected, including on direct question links.
    new MutationObserver(records => {
      for (const record of records) record.addedNodes.forEach(scan);
    }).observe(document.querySelector('main'), {childList:true, subtree:true});
    scan(document.querySelector('main'));
  }

  if (!window.crypto?.subtle || !window.DecompressionStream) {
    button.disabled = true;
    status.textContent = 'Use an up-to-date browser and open the HTTPS course address.';
    return;
  }
  gate.addEventListener('submit', async event => {
    event.preventDefault();
    if (button.disabled) return;
    button.disabled = true;
    status.textContent = 'Opening the course map…';
    const password = encoder.encode(input.value);
    input.value = '';
    try {
      mapPacket ||= download('map').catch(error => { mapPacket = null; throw error; });
      const [key, packet] = await Promise.all([unlockKey(password), mapPacket]);
      const compressed = await decrypt(key, 'map', packet);
      const stream = new Blob([compressed]).stream().pipeThrough(new DecompressionStream('gzip'));
      const html = await new Response(stream).text();
      const viewer = createSlideLink(async () => {
        const bytes = await decrypt(key, 'slides', await download('slides'));
        return new Blob([bytes], {type:'application/pdf'});
      });
      mapPacket = null;
      document.open();
      document.write(html.replaceAll('__PF_ATLAS_SLIDES_BLOB__', viewer));
      document.close();
      loadQuestionFigures(key);
    } catch (error) {
      status.textContent = error.name === 'OperationError' ? 'The passcode did not unlock this course. Try again.'
        : 'The course map could not be opened. Try again or reload the page.';
      button.disabled = false;
      input.focus();
    } finally {
      password.fill(0);
    }
  });
})();
</script></body></html>
