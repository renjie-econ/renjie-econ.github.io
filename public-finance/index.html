<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#173e34"><meta name="referrer" content="no-referrer">
<title>Public Finance · Course Atlas</title>
<style>
:root{color-scheme:light;font-family:"Avenir Next",Arial,sans-serif;color:#173d31;background:#f7f7ef}
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;align-content:center;justify-items:center;padding:26px}
main{width:min(100%,464px);padding:clamp(24px,6vw,42px);border:1px solid #cbd5c5;border-top:5px solid #204b39;border-radius:7px;background:#fffef7}
.kicker{font-size:12px;font-weight:700;letter-spacing:.11em;text-transform:uppercase;color:#506948}
h1{font:normal clamp(36px,7vw,57px)/1.05 Georgia,serif;letter-spacing:-.05em;margin:16px 0}
p{font-size:16px;line-height:1.5;color:#495e51;margin:0 0 26px}
label{display:block;margin-bottom:6px;font-weight:650}input,button{font:inherit;border-radius:5px;padding:11px 13px;width:100%}
input{border:1px solid #a2b39e;color:inherit;background:white}button{margin-top:12px;color:white;background:#204b39;border:1px solid #204b39;cursor:pointer;font-weight:650}button:disabled{opacity:.7;cursor:progress}
:focus-visible{outline:3px solid #c58424;outline-offset:3px}#feedback{font-size:14px;margin:12px 0 0;min-height:21px}
</style></head><body>
<main><div class="kicker">Course atlas</div><h1>Public Finance</h1>
<p>Enter your course passcode to open the map, questions and lecture slides.</p>
<form id="gate" autocomplete="off"><label for="passcode">Course passcode</label>
<input id="passcode" type="password" autocomplete="off" autocapitalize="none" spellcheck="false" required>
<button type="submit">Open course atlas</button><p id="feedback" role="status" aria-live="polite"></p></form>
<noscript>Enable JavaScript to unlock the atlas.</noscript></main>
<script>
(() => {
  'use strict';
  const form = document.getElementById('gate');
  const field = document.getElementById('passcode');
  const button = form.querySelector('button');
  const status = document.getElementById('feedback');
  const encoder = new TextEncoder();
  const decoder = new TextDecoder('utf-8', {fatal:true});
  let encrypted;
  const formatError = 'The course package could not be loaded. Reload the page and try again.';
  if (!window.crypto?.subtle) {
    button.disabled = true;
    status.textContent = 'Open the secure HTTPS course address in a current browser.';
    return;
  }
  form.addEventListener('submit', async event => {
    event.preventDefault();
    if (button.disabled) return;
    button.disabled = true;
    status.textContent = 'Opening the course materials…';
    const password = encoder.encode(field.value);
    field.value = '';
    let stage = 'fetch';
    try {
      if (!encrypted) {
        const response = await fetch('course.bin?v=73bcc9d770cd283c6b539424', {credentials:'same-origin'});
        if (!response.ok) throw new Error('Read failed');
        encrypted = new Uint8Array(await response.arrayBuffer());
      }
      const header = encrypted.subarray(0, 56);
      if (header.length !== 56 || decoder.decode(header.subarray(0, 8)) !== 'PFATLAS1') throw new Error('Invalid package');
      const view = new DataView(header.buffer, header.byteOffset, header.byteLength);
      const split = 56 + view.getUint32(48);
      if (split <= 72 || split + view.getUint32(52) !== encrypted.length) throw new Error('Invalid length');
      stage = 'decrypt';
      const material = await crypto.subtle.importKey('raw', password, 'PBKDF2', false, ['deriveKey']);
      password.fill(0);
      const key = await crypto.subtle.deriveKey({
        name:'PBKDF2', hash:'SHA-256', salt:header.subarray(8,24), iterations:600000
      }, material, {name:'AES-GCM',length:256}, false, ['decrypt']);
      const open = (offset, start, end) => crypto.subtle.decrypt({
        name:'AES-GCM', iv:header.subarray(offset,offset+12), additionalData:header, tagLength:128
      }, key, encrypted.subarray(start,end));
      // Authenticate the relatively small HTML first. Only process the PDF for a valid key.
      const html = decoder.decode(await open(24,56,split));
      const pdfBytes = await open(36,split,encrypted.length);
      const pdfURL = URL.createObjectURL(new Blob([pdfBytes], {type:'application/pdf'}));
      stage = 'display';
      // Keep the course URL (and any incoming hash) as the atlas navigation context.
      // Blob URLs are only for the PDF, which opens in the browser's native viewer.
      const atlas = html.replaceAll('__PF_ATLAS_SLIDES_BLOB__', pdfURL);
      encrypted = null;
      document.open();
      document.write(atlas);
      document.close();
    } catch (error) {
      status.textContent = stage === 'decrypt' ? 'The passcode did not unlock this course package. Try again.'
        : stage === 'display' ? 'The atlas could not be opened. Reload the page and try again.' : formatError;
      button.disabled = false;
      field.focus();
    } finally {
      password.fill(0);
    }
  });
})();
</script></body></html>
